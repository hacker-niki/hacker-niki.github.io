<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#121917" />
    <title>Traceroute — маршрут пакета</title>
    <link rel="icon" href="../media/icon.png" />
    <link rel="stylesheet" href="../demo-shell.css" />
    <link rel="stylesheet" href="api-labs.css" />
    <script src="trace.js" defer></script>
  </head>
  <body class="api-lab">
    <header class="lab-nav">
      <a href="../#catalog">← Все демо</a><a href="https://github.com/hacker-niki/traceroute">Исходники ↗</a>
    </header>
    <main class="lab-space">
      <h1>Traceroute</h1>
      <p class="lab-lead">
        Проследи один маршрут до 203.0.113.42. Каждый шаг увеличивает TTL пакета на единицу. Адреса и задержки
        заданы в примере, вся симуляция работает локально.
      </p>
      <div class="lab-duo">
        <section class="lab-box">
          <h2>Параметры трассы</h2>
          <div class="lab-form">
            <label
              >Предел переходов · TTL <output id="trace-count" for="trace-ttl">1</output
              ><input id="trace-ttl" type="range" min="1" max="5" value="1"
            /></label>
            <label
              >Ожидание ответа<select id="trace-timeout">
                <option value="1">1 секунда</option>
                <option value="2">2 секунды</option>
              </select></label
            >
            <button id="trace-next" type="button">Следующий переход →</button>
          </div>
          <h3>Что произошло</h3>
          <p id="trace-status" class="lab-status" role="status"></p>
          <details class="lab-wire" open>
            <summary>Вывод терминала</summary>
            <pre id="trace-output"></pre>
          </details>
        </section>
        <section class="lab-box">
          <h2>Маршрут пакета</h2>
          <ol class="trace-steps" id="trace-steps"></ol>
        </section>
      </div>
    </main>
  </body>
</html>
